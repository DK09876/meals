<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f1">
<title>Meals - offline</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f5f1; color: #1b231e;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { margin: 8px 0 0; font-size: 22px; }
  p { margin: 0; max-width: 320px; color: #56605a; font-size: 17px; line-height: 1.45; }
  button { margin-top: 12px; min-height: 52px; padding: 0 26px; border: 0; border-radius: 14px; background: #2e6b4e;
    color: #fff; font-size: 17px; font-weight: 700; }
</style>
</head>
<body>
<main>
  <img src="icons/apple-touch-icon.png" alt="">
  <h1>Can't reach Meals</h1>
  <p>It lives on a private network. Check that Tailscale is connected on this phone, then try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
