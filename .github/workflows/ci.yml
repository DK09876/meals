name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Pi, so CI cannot pass on a version the Pi will not run.
          node-version: '20'
          cache: npm

      # lib/backup-script.test.ts runs the real backup script.
      - name: Install sqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
